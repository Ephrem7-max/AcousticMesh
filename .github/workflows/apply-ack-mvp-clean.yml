name: Apply Acoustic ACK MVP Clean Patch

on:
  push:
    branches:
      - feat/ack-mvp-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          before_lines = len(text.splitlines())

          if "function sendReliableCommand(command)" in text:
              raise SystemExit("ACK patch already applied")

          def replace_between(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          old = "      duplicateCooldown: 1800,\n\n      /*\n       * Maximum event history.\n       */"
          new = "      duplicateCooldown: 1800,\n\n      /* Delivery acknowledgement settings. */\n      ackTimeout: 1400,\n      maxRetries: 3,\n\n      /*\n       * Maximum event history.\n       */"
          if old not in text:
              raise SystemExit("CONFIG anchor not found")
          text = text.replace(old, new, 1)

          old = "      lastCommand: null,\n      lastPacketTime: 0,"
          new = "      lastCommand: null,\n      lastPacketTime: 0,\n\n      pendingDelivery: null,\n      ackReceived: false,"
          if old not in text:
              raise SystemExit("STATE anchor not found")
          text = text.replace(old, new, 1)

          finalize = '''    function finalizeReceivedPacket() {\n\n      const packet = { ...receiverPacket };\n\n      resetReceiverPacket();\n\n      if (!packet.command) {\n        return;\n      }\n\n      if (packet.command === "ACK") {\n        state.ackReceived = true;\n        state.pendingDelivery = null;\n        txState.textContent = "DELIVERED ✓";\n        rxStateDisplay.textContent = "ACK RECEIVED";\n        createEvent({\n          command: "ACK",\n          direction: "RX",\n          frequency: CONFIG.frequencies.ACK,\n          signalStrength: packet.strength,\n          verified: true,\n          sequence: state.sequence\n        });\n        return;\n      }\n\n      if (state.transmitting) {\n        return;\n      }\n\n      const now = Date.now();\n      if (now - state.lastPacketTime < CONFIG.duplicateCooldown) {\n        return;\n      }\n      state.lastPacketTime = now;\n\n      state.packetCount++;\n      packetCountDisplay.textContent = String(state.packetCount);\n\n      const valid =\n        packet.symbols.includes("SYNC") &&\n        packet.symbols.includes(packet.command) &&\n        packet.symbols.includes("END");\n\n      if (!valid) {\n        return;\n      }\n\n      createEvent({\n        command: packet.command,\n        direction: "RX",\n        frequency: Math.round(\n          packet.frequency ||\n          COMMANDS[packet.command]?.frequency ||\n          0\n        ),\n        signalStrength: packet.strength,\n        verified: true,\n        sequence: state.packetCount\n      });\n\n      rxStateDisplay.textContent = "PACKET VERIFIED";\n\n      setTimeout(() => {\n        if (state.audioReady && !state.transmitting) {\n          transmitPacket("ACK", { waitForAck: false });\n        }\n      }, 80);\n\n      setTimeout(() => {\n        if (state.receiverRunning) {\n          rxStateDisplay.textContent = "LISTENING";\n        }\n      }, 900);\n    }\n\n'''
          text = replace_between(\n              text,\n              "    function finalizeReceivedPacket(",\n              "    function handleAcousticSymbol(",\n              finalize\n          )

          transmit = '''    async function transmitPacket(\n      command,\n      options = {}\n    ) {\n\n      if (!state.audioReady) {\n        alert("Initialize the Audio Engine first.");\n        return false;\n      }\n\n      if (state.transmitting) {\n        return false;\n      }\n\n      const waitForAck =\n        options.waitForAck !== false &&\n        command !== "ACK";\n\n      state.transmitting = true;\n\n      const packet = buildPacket(command);\n\n      if (command !== "ACK") {\n        state.lastCommand = command;\n        repeatButton.disabled = false;\n        lastTx.textContent = command;\n      }\n\n      txState.textContent =\n        `TRANSMITTING ${command}`;\n\n      try {\n        const total = packet.symbols.length;\n\n        for (let i = 0; i < total; i++) {\n          const symbol = packet.symbols[i];\n          txState.textContent = `TX ${symbol}`;\n          txProgress.style.width =\n            `${Math.round(i / total * 100)}%`;\n          await transmitSymbol(symbol);\n        }\n\n        txProgress.style.width = "100%";\n\n        if (command === "ACK") {\n          txState.textContent = "ACK SENT";\n          return true;\n        }\n\n        createEvent({\n          command,\n          direction: "TX",\n          frequency: COMMANDS[command]?.frequency || 0,\n          signalStrength: null,\n          verified: true,\n          sequence: state.sequence\n        });\n\n        if (waitForAck) {\n          state.ackReceived = false;\n          state.pendingDelivery = {\n            command,\n            sequence: state.sequence,\n            attempt: options.attempt || 1\n          };\n          txState.textContent =\n            `WAITING FOR ACK • ATTEMPT ${options.attempt || 1}`;\n\n          await sleep(CONFIG.ackTimeout);\n\n          if (state.ackReceived) {\n            return true;\n          }\n\n          state.pendingDelivery = null;\n          return false;\n        }\n\n        return true;\n      } catch (error) {\n        console.error("Transmission failed:", error);\n        txState.textContent = "TX ERROR";\n        return false;\n      } finally {\n        state.transmitting = false;\n        setTimeout(() => {\n          txProgress.style.width = "0%";\n          txTimer.textContent = "0.0s";\n          if (!state.transmitting && !state.pendingDelivery) {\n            txState.textContent = "TRANSMITTER READY";\n          }\n        }, 900);\n      }\n    }\n\n'''
          text = replace_between(\n              text,\n              "    async function transmitPacket(",\n              "    /* ============================================================\n       21. COMMAND BUTTONS",\n              transmit\n          )

          helper = '''    async function sendReliableCommand(command) {\n      for (let attempt = 1; attempt <= CONFIG.maxRetries; attempt++) {\n        if (attempt > 1) {\n          txState.textContent =\n            `RETRY ${attempt}/${CONFIG.maxRetries}`;\n          await sleep(250);\n        }\n\n        const delivered = await transmitPacket(command, {\n          attempt,\n          waitForAck: true\n        });\n\n        if (delivered) {\n          txState.textContent = "DELIVERED ✓";\n          return true;\n        }\n      }\n\n      txState.textContent = "DELIVERY FAILED ⚠";\n      createEvent({\n        command,\n        direction: "TX",\n        frequency: COMMANDS[command]?.frequency || 0,\n        signalStrength: null,\n        verified: false,\n        sequence: state.sequence\n      });\n      return false;\n    }\n\n\n    commandButtons.forEach(\n      button => {\n        button.addEventListener(\n          "click",\n          async () => {\n            const command = button.dataset.command;\n            if (command === "ACK") return;\n            await sendReliableCommand(command);\n          }\n        );\n      }\n\n\n'''
          text = replace_between(\n              text,\n              "    commandButtons.forEach(",\n              "    /* ============================================================\n       22. REPEAT",\n              helper\n          )

          repeat = '''    repeatButton.addEventListener(\n      "click",\n      async () => {\n        if (state.lastCommand) {\n          await sendReliableCommand(state.lastCommand);\n        }\n      }\n    );\n\n\n'''
          text = replace_between(\n              text,\n              "    repeatButton.addEventListener(",\n              "    /* ============================================================\n       23. START SYSTEM",\n              repeat\n          )

          after_lines = len(text.splitlines())
          if after_lines < before_lines - 100 or after_lines > before_lines + 200:
              raise SystemExit(f"Safety check failed: {before_lines} -> {after_lines} lines")

          path.write_text(text, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "index.html"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: add acoustic ACK and automatic retry [skip ci]"], check=True)
          subprocess.run(["git", "push"], check=True)

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-ack-mvp-clean.yml
          git commit -m "chore: remove one-time ACK patcher [skip ci]"
          git push
