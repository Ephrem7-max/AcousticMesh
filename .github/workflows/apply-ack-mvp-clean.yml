name: Apply Acoustic ACK MVP Clean Patch

on:
  push:
    branches:
      - feat/ack-mvp-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          before_lines = len(text.splitlines())

          def replace_between(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement + source[end:]

          old = "      duplicateCooldown: 1800,\n\n      /*\n       * Maximum event history.\n       */"
          new = "      duplicateCooldown: 1800,\n\n      /* Delivery acknowledgement settings. */\n      ackTimeout: 1400,\n      maxRetries: 3,\n\n      /*\n       * Maximum event history.\n       */"
          if old not in text:
              raise SystemExit("CONFIG anchor not found")
          text = text.replace(old, new, 1)

          old = "      lastCommand: null,\n      lastPacketTime: 0,"
          new = "      lastCommand: null,\n      lastPacketTime: 0,\n\n      pendingDelivery: null,\n      ackReceived: false,"
          if old not in text:
              raise SystemExit("STATE anchor not found")
          text = text.replace(old, new, 1)

          finalize = '''    function finalizeReceivedPacket() {\n\n      const packet =\n        { ...receiverPacket };\n\n      resetReceiverPacket();\n\n      if (!packet.command) {\n        return;\n      }\n\n      if (packet.command === "ACK") {\n        state.ackReceived = true;\n        state.pendingDelivery = null;\n        txState.textContent = "DELIVERED ✓";\n        rxStateDisplay.textContent = "ACK RECEIVED";\n        createEvent({\n          command: "ACK",\n          direction: "RX",\n          frequency: CONFIG.frequencies.ACK,\n          signalStrength: packet.strength,\n          verified: true,\n          sequence: state.sequence\n        });\n        return;\n      }\n\n      if (state.transmitting) {\n        return;\n      }\n\n      const now = Date.now();\n      if (now - state.lastPacketTime < CONFIG.duplicateCooldown) {\n        return;\n      }\n      state.lastPacketTime = now;\n\n      state.packetCount++;\n      packetCountDisplay.textContent =\n        String(state.packetCount);\n\n      const valid =\n        packet.symbols.includes("SYNC") &&\n        packet.symbols.includes(packet.command);\n\n      if (!valid) {\n        return;\n      }\n\n      createEvent({\n        command: packet.command,\n        direction: "RX",\n        frequency:\n          Math.round(\n            packet.frequency ||\n            COMMANDS[packet.command]?.frequency ||\n            0\n          ),\n        signalStrength: packet.strength,\n        verified: true,\n        sequence: state.packetCount\n      });\n\n      rxStateDisplay.textContent =\n        "PACKET VERIFIED";\n\n      setTimeout(() => {\n        if (state.audioReady && !state.transmitting) {\n          transmitPacket("ACK", { waitForAck: false });\n        }\n      }, 80);\n\n      setTimeout(() => {\n        if (state.receiverRunning) {\n          rxStateDisplay.textContent = "LISTENING";\n        }\n      }, 900);\n    }\n\n\n'''
          text = replace_between(text, "    function finalizeReceivedPacket(", "    /* ============================================================\n       16. RECEIVER LOOP", finalize)

          transmit = '''    async function transmitPacket(\n      command,\n      options = {}\n    ) {\n\n      if (!state.audioReady) {\n        alert(\n          "Initialize the Audio Engine first."\n        );\n        return false;\n      }\n\n      if (state.transmitting) {\n        return false;\n      }\n\n      const waitForAck =\n        options.waitForAck !== false &&\n        command !== "ACK";\n\n      state.transmitting = true;\n\n      const packet =\n        buildPacket(command);\n\n      if (command !== "ACK") {\n        state.lastCommand = command;\n        repeatButton.disabled = false;\n        lastTx.textContent = command;\n      }\n\n      txState.textContent =\n        `TRANSMITTING ${command}`;\n\n      try {\n        const total =\n          packet.symbols.length;\n\n        for (\n          let i = 0;\n          i < total;\n          i++\n        ) {\n          const symbol =\n            packet.symbols[i];\n\n          txState.textContent =\n            `TX ${symbol}`;\n\n          const percent =\n            Math.round(\n              i / total * 100\n            );\n\n          txProgress.style.width =\n            `${percent}%`;\n\n          await transmitSymbol(\n            symbol\n          );\n        }\n\n        txProgress.style.width =\n          "100%";\n\n        if (command === "ACK") {\n          txState.textContent =\n            "ACK SENT";\n          return true;\n        }\n\n        createEvent({\n          command,\n          direction: "TX",\n          frequency:\n            COMMANDS[command]?.frequency ||\n            0,\n          signalStrength: null,\n          verified: true,\n          sequence: state.sequence\n        });\n\n        if (waitForAck) {\n          state.ackReceived = false;\n          state.pendingDelivery = {\n            command,\n            sequence: state.sequence,\n            attempt: options.attempt || 1\n          };\n\n          txState.textContent =\n            `WAITING FOR ACK • ATTEMPT ${\n              options.attempt || 1\n            }`;\n\n          await sleep(\n            CONFIG.ackTimeout\n          );\n\n          if (state.ackReceived) {\n            return true;\n          }\n\n          state.pendingDelivery = null;\n          return false;\n        }\n\n        return true;\n\n      } catch (error) {\n        console.error(\n          "Transmission failed:",\n          error\n        );\n\n        txState.textContent =\n          "TX ERROR";\n\n        return false;\n\n      } finally {\n        state.transmitting = false;\n\n        setTimeout(() => {\n          txProgress.style.width =\n            "0%";\n\n          txTimer.textContent =\n            "0.0s";\n\n          if (\n            !state.transmitting &&\n            !state.pendingDelivery\n          ) {\n            txState.textContent =\n              "TRANSMITTER READY";\n          }\n        }, 900);\n      }\n    }\n\n\n'''
          text = replace_between(text, "    async function transmitPacket(", "    /* ============================================================\n       21. COMMAND BUTTONS", transmit)

          helper = '''    async function sendReliableCommand(command) {\n\n      for (\n        let attempt = 1;\n        attempt <= CONFIG.maxRetries;\n        attempt++\n      ) {\n        if (attempt > 1) {\n          txState.textContent =\n            `RETRY ${attempt}/${CONFIG.maxRetries}`;\n          await sleep(250);\n        }\n\n        const delivered =\n          await transmitPacket(command, {\n            attempt,\n            waitForAck: true\n          });\n\n        if (delivered) {\n          txState.textContent =\n            "DELIVERED ✓";\n          return true;\n        }\n      }\n\n      txState.textContent =\n        "DELIVERY FAILED ⚠";\n\n      createEvent({\n        command,\n        direction: "TX",\n        frequency:\n          COMMANDS[command]?.frequency ||\n          0,\n        signalStrength: null,\n        verified: false,\n        sequence: state.sequence\n      });\n\n      return false;\n    }\n\n\n    commandButtons.forEach(\n      button => {\n        button.addEventListener(\n          "click",\n          async () => {\n            const command =\n              button.dataset.command;\n\n            if (command === "ACK") {\n              return;\n            }\n\n            await sendReliableCommand(\n              command\n            );\n          }\n        );\n      }\n    );\n\n\n'''
          text = replace_between(text, "    commandButtons.forEach(", "    /* ============================================================\n       22. REPEAT", helper)

          repeat = '''    repeatButton.addEventListener(\n      "click",\n      async () => {\n        if (state.lastCommand) {\n          await sendReliableCommand(\n            state.lastCommand\n          );\n        }\n      }\n    );\n\n\n'''
          text = replace_between(text, "    repeatButton.addEventListener(", "    /* ============================================================\n       23. START SYSTEM", repeat)

          after_lines = len(text.splitlines())
          if after_lines < before_lines - 100 or after_lines > before_lines + 250:
              raise SystemExit(f"Safety check failed: {before_lines} -> {after_lines} lines")

          path.write_text(text, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "index.html"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: add acoustic ACK and automatic retry [skip ci]"], check=True)
          subprocess.run(["git", "push"], check=True)

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-ack-mvp-clean.yml
          git rm ACK_MVP_TRIGGER.txt
          git commit -m "chore: remove one-time ACK patcher [skip ci]"
          git push
